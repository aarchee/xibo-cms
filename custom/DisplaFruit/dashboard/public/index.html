<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DisplaFruit — Producción</title>
<style>
    /* Diseñado para TV (1080p, WebView modesto): sin librerías, sin animaciones costosas. */
    :root {
        --naranja: #F47920;
        --marron: #2A1D14;
        --marron-2: #3D2B1F;
        --verde: #4CAF50;
        --rojo: #E53935;
        --azul: #4FA3E0;
        --texto: #FFF8F2;
        --tenue: #d9c9bd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: var(--marron); color: var(--texto);
        display: flex; flex-direction: column; overflow: hidden;
    }
    header {
        display: flex; align-items: baseline; justify-content: space-between;
        padding: 1.6vh 2.5vw 0.8vh;
    }
    header .brand { font-size: 3.6vh; font-weight: 700; color: var(--naranja); }
    header .brand small { color: var(--texto); font-weight: 400; font-size: 2.6vh; }
    header .clock { font-size: 3.6vh; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
    header .date { font-size: 1.9vh; color: var(--tenue); text-align: right; }

    main { flex: 1; display: flex; flex-direction: column; padding: 0 2.5vw 1vh; gap: 1.4vh; min-height: 0; }

    /* Banda de bloques */
    .banda { display: grid; grid-template-columns: 1fr 1.3fr 1.1fr; gap: 1.4vw; }
    /* Sin volcado (pendiente de fuente): quedan confeccionado + destrío */
    .banda.sin-volc { grid-template-columns: 1.4fr 1fr; }
    .banda.sin-volc .bloque.volc { display: none; }
    .bloque { background: var(--marron-2); border-radius: 1.2vh; padding: 1.6vh 1.4vw; display: flex; flex-direction: column; }
    .bloque .cab { font-size: 2vh; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.06em; }
    .bloque .total { font-size: 6.4vh; font-weight: 800; line-height: 1.02; font-variant-numeric: tabular-nums; }
    .bloque .total small { font-size: 2.4vh; font-weight: 600; color: var(--tenue); margin-left: 0.5vw; }
    .bloque.volc { border-left: 0.6vw solid var(--azul); }
    .bloque.conf { border-left: 0.6vw solid var(--naranja); }
    .bloque.des  { border-left: 0.6vw solid #b9772e; }

    .partes { margin-top: 1vh; display: flex; flex-direction: column; gap: 0.7vh; }
    .parte { display: grid; grid-template-columns: 8.5vw 1fr auto; align-items: center; gap: 0.8vw; font-size: 2.2vh; }
    .parte .plabel { color: var(--tenue); }
    .parte .pbar { height: 1.4vh; background: rgba(255,255,255,0.10); border-radius: 99px; overflow: hidden; }
    .parte .pbar > i { display: block; height: 100%; background: var(--naranja); border-radius: 99px; }
    .parte.c-consum .pbar > i { background: #e0902f; }
    .parte.c-otros .pbar > i { background: #8a7059; }
    .parte .pval { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
    .parte .pval b { color: var(--tenue); font-weight: 400; font-size: 1.8vh; margin-left: 0.4vw; }
    .des .parte .pbar > i { background: #b9772e; }

    /* Productividad */
    .prod-cab { font-size: 2vh; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: -0.4vh; }
    .prod-cab b { color: var(--naranja); }
    .prod-wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2vw; align-items: stretch; }
    .prod { background: var(--marron-2); border-radius: 1.2vh; padding: 1.2vh 1vw; display: flex; flex-direction: column; justify-content: center; }
    .prod .plab { font-size: 1.9vh; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.04em; }
    .prod .pv { font-size: 4.6vh; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
    .prod .pv small { font-size: 2vh; color: var(--tenue); font-weight: 600; }
    .prod.ok .pv { color: var(--verde); }
    .prod.ko .pv { color: var(--rojo); }
    .prod.obj { background: transparent; border: 2px dashed rgba(244,121,32,0.5); align-items: center; text-align: center; }
    .prod.obj .plab { color: var(--naranja); }
    .prod.obj .pv { font-size: 3.6vh; color: var(--naranja); }

    /* Gráfico */
    .grafico { flex: 1; background: var(--marron-2); border-radius: 1.2vh; padding: 1.2vh 1.2vw 0.6vh; display: flex; flex-direction: column; min-height: 0; }
    .grafico .gcab { font-size: 2vh; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4vh; }
    .grafico svg { flex: 1; width: 100%; height: 100%; min-height: 0; }

    footer { display: flex; justify-content: space-between; align-items: center; padding: 0.6vh 2.5vw 1vh; font-size: 1.8vh; color: #b8a496; }
    .refdate { font-weight: 700; color: var(--naranja); margin-right: 1.2vw; }
    .aviso { display: none; font-weight: 700; padding: 0.3vh 1vw; border-radius: 99px; }
    .aviso.demo { display: inline-block; background: rgba(244,121,32,0.2); color: var(--naranja); }
    .aviso.stale { display: inline-block; background: rgba(229,57,53,0.2); color: var(--rojo); }
</style>
</head>
<body>
    <header>
        <div class="brand">🍌 DisplaFruit <small id="titulo">· Producción</small></div>
        <div>
            <div class="clock" id="reloj">--:--</div>
            <div class="date" id="fecha"></div>
        </div>
    </header>

    <main>
        <!-- Banda: volcado (oculto si pendiente) | confeccionado | destrío -->
        <div class="banda" id="banda">
            <div class="bloque volc">
                <div class="cab">Kg volcado</div>
                <div class="total" id="volc-total">—</div>
            </div>
            <div class="bloque conf">
                <div class="cab">Kg confeccionado</div>
                <div class="total" id="conf-total">—</div>
                <div class="partes" id="conf-partes"></div>
            </div>
            <div class="bloque des">
                <div class="cab">Kg destrío</div>
                <div class="total" id="des-total">—</div>
                <div class="partes" id="des-partes"></div>
            </div>
        </div>

        <!-- Productividad -->
        <div class="prod-cab" id="prod-cab">Productividad de la línea (kg/h)</div>
        <div class="prod-wrap" id="prod-wrap"></div>

        <!-- Gráfico -->
        <div class="grafico">
            <div class="gcab" id="gcab">Productividad de la línea — confeccionado por tramos de 30 min (kg/h)</div>
            <svg id="chart" viewBox="0 0 1000 320" preserveAspectRatio="none"></svg>
        </div>
    </main>

    <footer>
        <span id="actualizado">Conectando…</span>
        <span><span class="refdate" id="refdate"></span><span class="aviso" id="aviso"></span></span>
    </footer>

<script>
(function () {
    'use strict';
    var refreshMs = 60000;
    // Base absoluta del dashboard, inyectada por el servidor (cabecera Host). Así el panel pide
    // sus datos al :8090 aunque Xibo lo muestre envuelto desde otro origen. Si no se inyecta
    // (fichero abierto directo), queda vacío = mismo origen (relativo).
    var API_BASE = '__API_BASE__';
    if (API_BASE.slice(0, 2) === '__') { API_BASE = ''; }

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function fmt(n) { return (typeof n === 'number') ? n.toLocaleString('es-ES') : esc(n); }

    function tick() {
        var d = new Date();
        document.getElementById('reloj').textContent =
            ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        document.getElementById('fecha').textContent =
            d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    tick(); setInterval(tick, 1000);

    function renderPartes(el, partes, claseCliente) {
        el.innerHTML = (partes || []).map(function (p) {
            var cls = claseCliente ? (' c-' + esc(String(p.label).toLowerCase())) : '';
            return '<div class="parte' + cls + '">' +
                '<span class="plabel">' + esc(p.label) + '</span>' +
                '<span class="pbar"><i style="width:' + (p.pct || 0) + '%"></i></span>' +
                '<span class="pval">' + fmt(p.kg) + '<b>' + (p.pct || 0) + '%</b></span>' +
            '</div>';
        }).join('');
    }

    function renderProd(prod) {
        var tiles = [
            { lab: 'Media día', v: prod.mediaDia },
            { lab: 'Última hora', v: prod.ultimaHora },
            { lab: 'Últimos 30′', v: prod.ultimos30 },
            { lab: 'Últimos 10′', v: prod.ultimos10 },
        ];
        document.getElementById('prod-wrap').innerHTML = tiles.map(function (t) {
            return '<div class="prod"><div class="plab">' + esc(t.lab) + '</div>' +
                   '<div class="pv">' + fmt(t.v) + ' <small>kg/h</small></div></div>';
        }).join('');
    }

    function renderChart(serie) {
        var svg = document.getElementById('chart');
        var W = 1000, H = 320, pad = { l: 62, r: 24, t: 18, b: 34 };
        if (!serie || !serie.length) {
            svg.innerHTML = '<text x="500" y="160" fill="#b8a496" font-size="22" text-anchor="middle">Sin producción registrada</text>';
            return;
        }
        var maxV = Math.max.apply(null, serie.map(function (s) { return s.kg; })) || 500;
        var step = maxV > 4000 ? 2000 : (maxV > 1500 ? 1000 : 500);
        // +15% de margen sobre el máximo antes de redondear al alza: así el punto más alto nunca
        // queda pegado al techo y su etiqueta (que va encima) no se corta por arriba.
        var niceMax = Math.ceil((maxV * 1.15) / step) * step;
        var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
        var n = serie.length;
        var xOf = function (i) { return pad.l + (n === 1 ? iw / 2 : (iw * i) / (n - 1)); };
        var yOf = function (v) { return pad.t + ih - (ih * v) / niceMax; };

        var parts = [];
        // Rejilla horizontal + etiquetas Y
        for (var g = 0; g <= niceMax; g += step) {
            var y = yOf(g);
            parts.push('<line x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y +
                '" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>');
            parts.push('<text x="' + (pad.l - 8) + '" y="' + (y + 5) + '" fill="#b8a496" font-size="16" text-anchor="end">' +
                fmt(g) + '</text>');
        }

        // Área + línea (todos los tramos de 30 min)
        var pts = serie.map(function (s, i) { return xOf(i) + ',' + yOf(s.kg); });
        var area = 'M' + pad.l + ',' + (pad.t + ih) + ' L' + pts.join(' L') + ' L' + (xOf(n - 1)) + ',' + (pad.t + ih) + ' Z';
        parts.push('<path d="' + area + '" fill="rgba(244,121,32,0.16)"/>');
        parts.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="#F47920" stroke-width="3.5" stroke-linejoin="round"/>');
        // Puntos en todos los tramos; valor y etiqueta X solo en las horas en punto (para no saturar)
        serie.forEach(function (s, i) {
            var x = xOf(i), y = yOf(s.kg);
            var enHora = /:00$/.test(s.label || '');
            parts.push('<circle cx="' + x + '" cy="' + y + '" r="' + (enHora ? 4.5 : 3) + '" fill="#FFF8F2"/>');
            if (enHora) {
                // En los bordes, ancla el texto a 'start'/'end' para que no se corte lateralmente.
                var anc = (x > W - pad.r - 45) ? 'end' : (x < pad.l + 45 ? 'start' : 'middle');
                parts.push('<text x="' + x + '" y="' + (y - 12) + '" fill="#FFF8F2" font-size="15" text-anchor="' + anc + '">' + fmt(s.kg) + '</text>');
                parts.push('<text x="' + x + '" y="' + (H - 10) + '" fill="#b8a496" font-size="16" text-anchor="' + anc + '">' + esc(s.label) + '</text>');
            }
        });
        svg.innerHTML = parts.join('');
    }

    function render(data) {
        document.getElementById('titulo').textContent = '· ' + (data.title || 'Producción');
        // Volcado: si viene null, no hay fuente todavía -> se oculta la banda (2 columnas).
        var banda = document.getElementById('banda');
        if (data.volcado == null) {
            banda.classList.add('sin-volc');
        } else {
            banda.classList.remove('sin-volc');
            document.getElementById('volc-total').innerHTML = fmt(data.volcado) + ' <small>kg</small>';
        }

        var conf = data.confeccionado || { total: 0, partes: [] };
        document.getElementById('conf-total').innerHTML = fmt(conf.total || 0) + ' <small>kg</small>';
        renderPartes(document.getElementById('conf-partes'), conf.partes, true);

        var des = data.destrio || { total: 0, partes: [] };
        document.getElementById('des-total').innerHTML = fmt(des.total || 0) + ' <small>kg</small>';
        renderPartes(document.getElementById('des-partes'), des.partes, false);

        document.getElementById('prod-cab').innerHTML = 'Productividad de la línea (kg/h)';
        renderProd(data.productividad || {});
        renderChart(data.serie || []);

        var act = document.getElementById('actualizado');
        if (data.updatedAt) {
            var d = new Date(data.updatedAt);
            act.textContent = 'Actualizado a las ' + ('0' + d.getHours()).slice(-2) + ':' +
                ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2) +
                ' · cada ' + Math.round(refreshMs / 1000) + ' s';
        }
        document.getElementById('refdate').textContent = data.refDate ? ('📅 Datos de: ' + data.refDate) : '';
        var aviso = document.getElementById('aviso');
        if (data.stale) { aviso.className = 'aviso stale'; aviso.textContent = '⚠ Sin conexión — último dato'; }
        else if (data.mock) { aviso.className = 'aviso demo'; aviso.textContent = 'MODO DEMO'; }
        else { aviso.className = 'aviso'; aviso.textContent = ''; }
    }

    function poll() {
        fetch(API_BASE + '/api/data', { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (data.refreshSeconds) { refreshMs = data.refreshSeconds * 1000; }
                render(data);
            })
            .catch(function () {
                var aviso = document.getElementById('aviso');
                aviso.className = 'aviso stale';
                aviso.textContent = '⚠ Sin conexión con el servidor del dashboard';
            })
            .then(function () { setTimeout(poll, refreshMs); });
    }
    poll();
})();
</script>
</body>
</html>
